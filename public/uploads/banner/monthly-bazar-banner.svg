<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290">
  <defs>
    <linearGradient id="mb_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="35%" stop-color="#a7f3d0"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadowMb" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="290" rx="14" fill="url(#mb_bg)"/>

  <!-- Left: Circular Logo & Shop Now Button -->
  <g transform="translate(45, 25)">
    <circle cx="80" cy="75" r="56" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="url(#shadowMb)"/>
    <text x="80" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#007e8a" text-anchor="middle">A<tspan fill="#e11d48">●</tspan>SMI</text>
    <text x="80" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0284c7" text-anchor="middle">Supershop</text>

    <!-- SHOP NOW Pill -->
    <g transform="translate(5, 145)" filter="url(#shadowMb)">
      <rect width="150" height="42" rx="21" fill="#0284c7"/>
      <text x="75" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">SHOP NOW</text>
    </g>

    <!-- Contact details bottom -->
    <g transform="translate(0, 205)">
      <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#0369a1">📞 01805020340</text>
      <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0284c7">🌐 www.asmishop.com</text>
    </g>
  </g>

  <!-- Center: Shopping Cart with Grocery Vegetables & Catchy Bengali Typography -->
  <g transform="translate(300, 15)">
    <!-- Cart Wireframe -->
    <g transform="translate(50, 20)">
      <!-- Veggies overflowing cart -->
      <circle cx="70" cy="40" r="32" fill="#22c55e"/>
      <circle cx="120" cy="30" r="38" fill="#eab308"/>
      <circle cx="170" cy="35" r="35" fill="#ef4444"/>
      <circle cx="210" cy="45" r="28" fill="#a855f7"/>

      <!-- Cart body -->
      <polygon points="30,70 230,70 200,180 60,180" fill="#1e293b" opacity="0.9" filter="url(#shadowMb)"/>
      <line x1="30" y1="70" x2="230" y2="70" stroke="#f8fafc" stroke-width="3"/>
      <line x1="45" y1="105" x2="215" y2="105" stroke="#f8fafc" stroke-width="2"/>
      <line x1="55" y1="140" x2="205" y2="140" stroke="#f8fafc" stroke-width="2"/>
      <!-- Vertical wires -->
      <line x1="80" y1="70" x2="80" y2="180" stroke="#f8fafc" stroke-width="2"/>
      <line x1="130" y1="70" x2="130" y2="180" stroke="#f8fafc" stroke-width="2"/>
      <line x1="180" y1="70" x2="180" y2="180" stroke="#f8fafc" stroke-width="2"/>

      <!-- Cart wheels -->
      <circle cx="80" cy="195" r="14" fill="#0f172a"/>
      <circle cx="80" cy="195" r="5" fill="#ffffff"/>
      <circle cx="180" cy="195" r="14" fill="#0f172a"/>
      <circle cx="180" cy="195" r="5" fill="#ffffff"/>
      
      <!-- Catchy Bengali text badge over the cart -->
      <g transform="translate(50, 85)">
        <rect x="0" y="0" width="160" height="46" rx="8" fill="#facc15" stroke="#000000" stroke-width="2"/>
        <text x="80" y="28" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle">বাজার হোক সাশ্রয়ী,</text>
      </g>
      <g transform="translate(50, 133)">
        <rect x="0" y="0" width="160" height="42" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="80" y="26" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="19" font-weight="900" fill="#dc2626" text-anchor="middle">সেভিংস হোক বেশি!</text>
      </g>
    </g>

    <!-- Bottom Hotline info bar -->
    <g transform="translate(140, 235)">
      <rect width="250" height="34" rx="17" fill="#0284c7"/>
      <text x="125" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ASMI Hotline: 09617900200</text>
    </g>
  </g>

  <!-- Right: Products Array (Diploma milk, Fresh flour, Fortune oil, Vim, Sacks of rice & lentils) -->
  <g transform="translate(740, 20)" filter="url(#shadowMb)">
    <!-- FREE HOME DELIVERY header -->
    <g transform="translate(50, 10)">
      <text x="0" y="20" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="20" font-weight="900" fill="#dc2626">FREE HOME DELIVERY</text>
      <rect x="0" y="25" width="220" height="3" fill="#dc2626"/>
    </g>

    <!-- Diploma Milk Powder Pack -->
    <g transform="translate(10, 45)">
      <rect width="75" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="5" y="10" width="65" height="40" fill="#0284c7"/>
      <text x="37" y="35" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">DIPLOMA</text>
      <circle cx="37" cy="75" r="16" fill="#ef4444"/>
      <text x="37" y="79" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">100%</text>
    </g>

    <!-- Pusti Atta Pack -->
    <g transform="translate(95, 40)">
      <rect width="70" height="115" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="5" y="10" width="60" height="50" fill="#dc2626"/>
      <text x="35" y="40" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">পুষ্টি আটা</text>
    </g>

    <!-- Lentils Sack -->
    <g transform="translate(175, 90)">
      <ellipse cx="40" cy="70" rx="36" ry="40" fill="#d97706"/>
      <ellipse cx="40" cy="38" rx="30" ry="12" fill="#ea580c"/>
      <text x="40" y="75" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">মসুর ডাল</text>
    </g>

    <!-- Rice Sack -->
    <g transform="translate(250, 95)">
      <ellipse cx="40" cy="65" rx="35" ry="38" fill="#cbd5e1"/>
      <ellipse cx="40" cy="35" rx="28" ry="10" fill="#ffffff"/>
      <text x="40" y="72" font-family="'Segoe UI', 'Hind Siliguri', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">মিনিকেট চাল</text>
    </g>

    <!-- Oil Bottle -->
    <g transform="translate(330, 30)">
      <rect x="25" y="0" width="20" height="25" rx="3" fill="#ca8a04"/>
      <path d="M10 25 L60 25 L65 170 L5 170 Z" fill="#eab308"/>
      <rect x="15" y="65" width="40" height="55" rx="3" fill="#ffffff"/>
      <text x="35" y="95" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#ca8a04" text-anchor="middle">OIL</text>
    </g>

    <!-- Vim Dishwash Bar -->
    <g transform="translate(345, 110)">
      <rect width="60" height="85" rx="4" fill="#16a34a"/>
      <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">Vim</text>
      <circle cx="30" cy="70" r="7" fill="#facc15"/>
    </g>
  </g>
</svg>