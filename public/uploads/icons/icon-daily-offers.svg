<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="doSunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="90%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="doShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 24-point Sunburst / Serrated Offer Seal -->
  <g filter="url(#doShadow)">
    <path d="M 50,4 L 54,12 L 62,8 L 64,16 L 73,15 L 73,23 L 82,24 L 79,32 L 87,36 L 82,43 L 89,50 L 82,57 L 87,64 L 79,68 L 82,76 L 73,77 L 73,85 L 64,84 L 62,92 L 54,88 L 50,96 L 46,88 L 38,92 L 36,84 L 27,85 L 27,77 L 18,76 L 21,68 L 13,64 L 18,57 L 11,50 L 18,43 L 13,36 L 21,32 L 18,24 L 27,23 L 27,15 L 36,16 L 38,8 L 46,12 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1.2"/>
    <!-- Outer ring with fiery radial gradient -->
    <circle cx="50" cy="50" r="38" fill="url(#doSunGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Inner dashed gold ring -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- Central Bold Text -->
    <text x="50" y="44" font-family="'Segoe UI', 'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DAILY</text>
    <text x="50" y="60" font-family="'Segoe UI', 'Arial Black', Impact, sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">OFFER</text>
    <!-- Star -->
    <path d="M 50,65 L 51.5,69 L 55,69 L 52,71 L 53,74.5 L 50,72.5 L 47,74.5 L 48,71 L 45,69 L 48.5,69 Z" fill="#ffffff"/>
  </g>
</svg>
