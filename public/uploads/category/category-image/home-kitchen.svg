<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cooking Pot on top -->
  <rect x="36" y="24" width="28" height="18" rx="4" fill="#38bdf8" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="32" y1="30" x2="36" y2="30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="30" x2="68" y2="30" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="34" y="20" width="32" height="5" rx="2" fill="#1e293b"/>
  <circle cx="50" cy="18" r="2.5" fill="#f59e0b"/>

  <!-- Gas Stove / Oven -->
  <rect x="22" y="44" width="56" height="42" rx="6" fill="#7dd3fc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Oven window -->
  <rect x="30" y="56" width="40" height="24" rx="4" fill="#1e293b"/>
  <!-- Knobs -->
  <circle cx="32" cy="50" r="3" fill="#1e293b"/>
  <circle cx="44" cy="50" r="3" fill="#1e293b"/>
  <circle cx="56" cy="50" r="3" fill="#1e293b"/>
  <circle cx="68" cy="50" r="3" fill="#1e293b"/>
</svg>