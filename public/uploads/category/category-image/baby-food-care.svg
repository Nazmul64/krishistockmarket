<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Baby Jar / Container -->
  <rect x="25" y="32" width="42" height="50" rx="10" fill="#7dd3fc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Jar Lid -->
  <rect x="29" y="24" width="34" height="10" rx="3" fill="#38bdf8" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Baby Face Badge -->
  <circle cx="46" cy="58" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="41" cy="56" r="2" fill="#1e293b"/>
  <circle cx="51" cy="56" r="2" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M43 62 Q46 66 49 62" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Baby hair tuft -->
  <path d="M46 44 Q48 40 46 38" stroke="#1e293b" stroke-width="2" fill="none"/>
  <!-- Feeding Spoon -->
  <g transform="translate(72, 38)">
    <ellipse cx="6" cy="12" rx="7" ry="10" fill="#f43f5e" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M6 22 L6 50" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="6" cy="50" r="2.5" fill="#1e293b"/>
  </g>
</svg>